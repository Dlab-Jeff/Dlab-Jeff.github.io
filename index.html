<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Curtain & Emojis</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color-1: #FFDEE9;
      --bg-color-2: #B5FFFC;
      --bg-color-3: #ffd1ff;
      --bg-color-4: #e0c3fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(-45deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3), var(--bg-color-4));
      background-size: 400% 400%;
      animation: gradientBg 15s ease infinite;
      user-select: none;
      -webkit-user-select: none;
    }

    @keyframes gradientBg {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .scroll-text {
      position: absolute;
      bottom: 40px;
      left: 40px;
      font-size: 2rem;
      font-weight: 800;
      color: #111;
      z-index: 2;
      animation: bounce 2s infinite cubic-bezier(0.28, 0.84, 0.42, 1);
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes scatterSpan {
      0% {
        transform: translate(0px, 0px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
        opacity: 0;
      }
    }

    .scroll-text.panic span {
      display: inline-block;
      animation: scatterSpan 2.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards !important;
    }

    /* --- Profile Overlay --- */
    #profile-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      transition: opacity 1s;
    }

    #profile-boxes {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + 100vh));
      flex-direction: row;
      gap: 40px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      border-radius: 30px;
      display: flex;
    }

    .photo-box img {
      width: 250px;
      height: 250px;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .text-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 15px;
      font-size: 1.4rem;
      font-weight: 800;
      color: #333;
    }

    .profile-text-row {
      white-space: nowrap;
    }

    .name-row {
      font-size: 3.5rem;
      color: #e67e22;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.15);
      margin-bottom: 10px;
    }

    .target-char {
      opacity: 0;
      display: inline-block;
    }

    .spilled-char {
      position: absolute;
      font-weight: 800;
      top: 0;
      left: 0;
    }

    #crane {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      transform-origin: top center;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 8;
    }

    .crane-base {
      width: 100px;
      height: 10px;
      background: #e67e22;
      border-radius: 0 0 5px 5px;
    }

    .crane-wire {
      width: 4px;
      height: 0px;
      background: #555;
    }

    .crane-hook {
      width: 80px;
      height: 30px;
      border: 6px solid #f1c40f;
      border-top: none;
      border-radius: 0 0 15px 15px;
    }

    .pinned-thumbtack {
      position: absolute;
      bottom: calc(100% - 20px);
      left: 50%;
      width: 8px;
      height: 32px;
      background: #bdc3c7;
      border-radius: 0 0 4px 4px;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(25deg);
      z-index: 10;
    }

    .pinned-thumbtack::before {
      content: '';
      position: absolute;
      top: -16px;
      left: -10px;
      width: 28px;
      height: 16px;
      background: #e74c3c;
      border-radius: 8px 8px 0 0;
      box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.2);
    }

    .crane-sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px #f1c40f, 0 0 20px #f1c40f;
      pointer-events: none;
      z-index: 20;
      animation: sparkleAnim 1s ease-out forwards;
    }

    @keyframes sparkleAnim {
      0% {
        transform: scale(0) translate(0, 0);
        opacity: 1;
      }

      100% {
        transform: scale(1.5) translate(var(--dx), var(--dy));
        opacity: 0;
      }
    }

    #bottom-portal {
      position: absolute;
      bottom: 0px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      border-radius: 50% 50% 0 0;
      filter: blur(10px);
      opacity: 0;
      width: 0px;
      height: 0px;
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.3s;
    }

    #darkness-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      opacity: 0;
      z-index: 999;
      background: radial-gradient(circle at 50% 100%, transparent var(--dark-radius), black calc(var(--dark-radius) + 15vw));
      transition: opacity 0.5s;
    }

    #bottom-portal.blackout-active {
      opacity: 1 !important;
      transition: opacity 0.5s;
    }

    .portal-ripple {
      position: absolute;
      bottom: -20px;
      left: 50%;
      border: 4px solid rgba(80, 80, 80, 0.5);
      border-radius: 50%;
      transform: translateX(-50%) scale(0.1);
      animation: rippleAnim 8s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
      pointer-events: none;
      mix-blend-mode: color-burn;
      will-change: transform, opacity;
      z-index: 0;
    }

    @keyframes rippleAnim {
      0% {
        transform: translateX(-50%) scale(0.1);
        opacity: 1;
        border-width: 8px;
      }

      100% {
        transform: translateX(-50%) scale(15);
        opacity: 0;
        border-width: 0px;
      }
    }

    #drop-zone-indicator {
      position: absolute;
      bottom: 0px;
      left: 50%;
      transform: translateX(-50%);
      width: 192px;
      height: 75px;
      border: 3px dashed rgba(0, 0, 0, 0.3);
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.5s;
    }

    /* Curtain Canvas */
    #curtain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
    }

    /* --- Card Scene --- */
    #card-scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 1s;
      overflow: hidden;
    }

    .card {
      width: 240px;
      height: 400px;
      position: absolute;
      transform-style: preserve-3d;
      transition: opacity 0.6s, box-shadow 0.6s;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      border-radius: 14px;
    }

    .card-back {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      background-color: #1a1a2e;
      border: 6px solid #d4af37;
      background-image:
        linear-gradient(45deg, rgba(212, 175, 55, 0.3) 25%, transparent 25%, transparent 75%, rgba(212, 175, 55, 0.3) 75%, rgba(212, 175, 55, 0.3)),
        linear-gradient(45deg, rgba(212, 175, 55, 0.3) 25%, transparent 25%, transparent 75%, rgba(212, 175, 55, 0.3) 75%, rgba(212, 175, 55, 0.3));
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 0;
      left: 0;
      backface-visibility: hidden;
      transform: translateZ(-1px);
    }

    .card-back::after {
      content: '';
      width: 120px;
      height: 120px;
      background: #1a1a2e;
      border: 3px solid #d4af37;
      border-radius: 50%;
      position: absolute;
    }

    .card-back::before {
      content: '';
      width: calc(100% - 30px);
      height: calc(100% - 30px);
      border: 2px solid rgba(212, 175, 55, 0.5);
      border-radius: 8px;
    }

    .card-front {
      width: 100%;
      height: 100%;
      background-color: #1a1a2e;
      border: 6px solid #d4af37;
      border-radius: 14px;
      position: absolute;
      top: 0; left: 0;
      backface-visibility: hidden;
      transform: rotateY(180deg) translateZ(1px);
      box-sizing: border-box;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px 20px 20px;
      color: white;
      text-align: center;
    }

    /* Front UI Base Components */
    .front-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      margin-top: 15px;
    }

    .card-title {
      font-size: 22px;
      font-weight: 800;
      color: #f1c40f;
      text-transform: uppercase;
      margin-bottom: 20px;
      border-bottom: 2px solid rgba(241, 196, 15, 0.3);
      padding-bottom: 10px;
      width: 100%;
      letter-spacing: 1px;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
    }

    .card-content p {
      font-size: 14px;
      line-height: 1.5;
      color: #ddd;
      margin-top: 15px;
    }

    .icon-symbol {
      font-size: 45px;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.4));
    }

    .card-link-block {
      width: 100%;
      height: 110px;
      border-radius: 8px;
      text-decoration: none;
      overflow: hidden;
      display: block;
      border: 2px solid rgba(255,255,255,0.2);
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
      z-index: 10;
      pointer-events: auto;
    }
    .card-link-block:hover {
      transform: scale(1.05);
      border-color: #f1c40f;
    }
    .fake-img-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    .highlight-text {
      background: rgba(241, 196, 15, 0.15);
      border: 1px solid #f1c40f;
      padding: 15px;
      border-radius: 8px;
      color: #f1c40f;
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .action-btn {
      background: #ff4d4d;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      z-index: 10;
      pointer-events: auto;
    }
    .action-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(255, 77, 77, 0.4);
    }

    /* Circled X Close Button */
    .close-card-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #d4af37;
      color: #d4af37;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.2s, background 0.2s, color 0.2s;
      font-weight: bold;
      background: transparent;
    }
    .close-card-btn:hover {
      transform: scale(1.15);
      background: #d4af37;
      color: #1a1a2e;
    }

    /* Custom Theme 6 */
    .card-back.card6-theme,
    .card-front.card6-theme {
       background-color: #3b0918;
       border-color: #ff4d4d;
       background-image: 
         linear-gradient(45deg, rgba(255, 77, 77, 0.15) 25%, transparent 25%, transparent 75%, rgba(255, 77, 77, 0.15) 75%, rgba(255, 77, 77, 0.15)),
         linear-gradient(45deg, rgba(255, 77, 77, 0.15) 25%, transparent 25%, transparent 75%, rgba(255, 77, 77, 0.15) 75%, rgba(255, 77, 77, 0.15));
    }
    .card-back.card6-theme::after {
       background: #3b0918;
       border-color: #ff4d4d;
    }
    .card-back.card6-theme::before {
       border-color: rgba(255, 77, 77, 0.5);
    }
    .card-front.card6-theme .card-title {
       color: #ff4d4d;
       border-color: rgba(255, 77, 77, 0.4);
    }
    .card-front.card6-theme .close-card-btn {
       color: #ff4d4d;
       border-color: #ff4d4d;
    }
    .card-front.card6-theme .close-card-btn:hover {
       background: #ff4d4d;
       color: #3b0918;
    }

    /* Custom Theme 0 (Portfolio) */
    .card-back.card0-theme,
    .card-front.card0-theme {
       background-color: #0b2e2d;
       border-color: #20c997;
       background-image: 
         linear-gradient(45deg, rgba(32, 201, 151, 0.15) 25%, transparent 25%, transparent 75%, rgba(32, 201, 151, 0.15) 75%, rgba(32, 201, 151, 0.15)),
         linear-gradient(45deg, rgba(32, 201, 151, 0.15) 25%, transparent 25%, transparent 75%, rgba(32, 201, 151, 0.15) 75%, rgba(32, 201, 151, 0.15));
    }
    .card-back.card0-theme::after {
       background: #0b2e2d;
       border-color: #20c997;
    }
    .card-back.card0-theme::before {
       border-color: rgba(32, 201, 151, 0.5);
    }
    .card-front.card0-theme .card-title {
       color: #20c997;
       border-color: rgba(32, 201, 151, 0.4);
    }
    .card-front.card0-theme .close-card-btn {
       color: #20c997;
       border-color: #20c997;
    }
    .card-front.card0-theme .close-card-btn:hover {
       background: #20c997;
       color: #0b2e2d;
    }

    .carousel-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      perspective: 1500px;
    }

    #cards-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(40, 40, 60, 0.5);
      color: #d4af37;
      border: 2px solid #d4af37;
      font-size: 2rem;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 20;
      backdrop-filter: blur(10px);
      transition: background 0.3s, transform 0.3s, opacity 0.5s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }

    .nav-arrow:hover {
      background: rgba(80, 80, 100, 0.8);
      transform: translateY(-50%) scale(1.1);
    }

    .nav-arrow.left {
      left: 40px;
    }

    .nav-arrow.right {
      right: 40px;
    }

    /* Hide arrows initially */
    .nav-arrow {
      opacity: 0;
      pointer-events: none;
    }

    .nav-arrow.show {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

<body>

  <!-- Background Scroll Indicator -->
  <div class="scroll-text">Scroll Down!! 🤭</div>

  <!-- Darkness Vignette Collapse Layer -->
  <div id="darkness-overlay" style="--dark-radius: 150vw;"></div>

  <!-- Card Scene Overlay -->
  <div id="card-scene">
    <div class="carousel-container">
      <div id="dim-overlay" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 500; opacity: 0; pointer-events: none;"></div>
      <button class="nav-arrow left" id="nav-left">&lt;</button>
      <div id="cards-wrapper"></div>
      <button class="nav-arrow right" id="nav-right">&gt;</button>
    </div>
  </div>

  <!-- Profile Overlay Layer -->
  <div id="profile-layer">
    <div id="bottom-portal"></div>
    <div id="drop-zone-indicator"></div>

    <div id="crane">
      <div class="crane-base"></div>
      <div class="crane-wire" id="crane-wire"></div>
      <div class="crane-hook"></div>
    </div>

    <div id="profile-boxes">
      <div id="pinned-thumbtack" class="pinned-thumbtack" style="opacity: 0;"></div>
      <div class="photo-box">
        <img src="data/profileImage.png" alt="Profile">
      </div>
      <div class="text-box">
        <div class="profile-text-row name-row">Jeff</div>
        <div class="profile-text-row">010-xxxx-xxxx</div>
        <div class="profile-text-row">itsnotreal@gmail.com</div>
        <div class="profile-text-row">somewhere in, Seoul, Republic of Korea</div>
      </div>
    </div>

    <div id="spilling-letters"></div>
  </div>

  <canvas id="curtain"></canvas>

  <script>
    const canvas = document.getElementById('curtain');
    const ctx = canvas.getContext('2d');

    // --- Emoji Setup ---
    const emojiList = ['🤭', '🫢', '🫣', '🤔', '🤫', '🤪', '😜', '🥹', '😋', '😝', '🤩', '😏', '😅'];
    const emojis = [];
    const numEmojis = 80;
    for (let i = 0; i < numEmojis; i++) {
      emojis.push({
        char: emojiList[Math.floor(Math.random() * emojiList.length)],
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2
      });
    }

    // --- Scroll Text Scatter Setup ---
    const scrollTextEl = document.querySelector('.scroll-text');
    const textStr = scrollTextEl.textContent;
    scrollTextEl.innerHTML = '';
    for (const char of textStr) {
      const span = document.createElement('span');
      if (char === ' ') {
        span.innerHTML = '&nbsp;';
      } else {
        span.textContent = char;
      }
      let dx = (Math.random() - 0.5) * 2000;
      let dy = (Math.random() - 0.5) * 2000;
      let rot = (Math.random() - 0.5) * 1080;
      span.style.setProperty('--dx', `${dx}px`);
      span.style.setProperty('--dy', `${dy}px`);
      span.style.setProperty('--rot', `${rot}deg`);
      scrollTextEl.appendChild(span);
    }

    // --- Profile Boxes Target Setting ---
    const targetSpans = [];
    document.querySelectorAll('.profile-text-row').forEach(row => {
      const text = row.textContent;
      row.innerHTML = '';
      for (const char of text) {
        const span = document.createElement('span');
        span.className = 'target-char';
        if (char === ' ') {
          span.innerHTML = '&nbsp;';
        } else {
          span.textContent = char;
          targetSpans.push(span);
        }
        row.appendChild(span);
      }
    });

    // --- State Variables ---
    let profileState = 'hidden';
    let craneHookY = 0;
    let craneAngle = 0;
    let craneVel = 0; // Crane Angular Velocity
    let craneYVel = 0; // Crane Gravity/Spring
    let craneYankVel = 0; // 초고속 프로필 리프팅 모터
    let isCraneGrabbed = false;
    let craneIdleTimer = 0;
    let portalRippleTimer = 0;
    let suctionEntities = [];
    let darknessRadius = 150;
    let boxesY = window.innerHeight;
    let boxesYVel = 0;
    let boxesAngle = 0;
    let boxesAngleVel = 0;
    let tackAnimProgress = 0;
    const spilledLetters = [];


    // --- Mouse Interaction Variables ---
    let targetRadius = 0;
    let currentRadius = 0;

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let lastMouseX = window.innerWidth / 2;
    let lastMouseY = window.innerHeight / 2;
    let isMouseActive = false;
    let mouseIsDown = false;

    window.addEventListener('mousedown', (e) => {
      mouseIsDown = true;
      if (profileState === 'idle') {
        const hook = document.querySelector('.crane-hook');
        if (hook) {
          const rect = hook.getBoundingClientRect();
          if (e.clientX >= rect.left - 20 && e.clientX <= rect.right + 20 && e.clientY >= rect.top - 20 && e.clientY <= rect.bottom + 20) {
            isCraneGrabbed = true;
            craneIdleTimer = 0;
          }
        }
      }
    });

    window.addEventListener('mouseup', () => {
      mouseIsDown = false;
      if (isCraneGrabbed) {
        isCraneGrabbed = false;
        const distY = window.innerHeight - mouseY;
        const distX = Math.abs(mouseX - window.innerWidth / 2);
        if (distY < 75 && distX < 96) {
          profileState = 'blackout';
          const overlay = document.getElementById('darkness-overlay');
          if (overlay) overlay.style.opacity = '1';

          const targets = document.querySelectorAll('.target-char, .spilled-char, .photo-box, .crane-base, .crane-wire, .crane-hook, .scroll-text, .pinned-thumbtack');

          targets.forEach(el => {
            if (window.getComputedStyle(el).display !== 'none' && el.id !== 'bottom-portal') {
              const rect = el.getBoundingClientRect();
              const computed = window.getComputedStyle(el);

              el.style.fontSize = computed.fontSize;
              el.style.color = computed.color;
              el.style.fontWeight = computed.fontWeight;
              el.style.whiteSpace = 'nowrap';

              suctionEntities.push({
                el: el,
                x: rect.left,
                y: rect.top,
                w: rect.width,
                h: rect.height,
                vx: (Math.random() - 0.5) * 20,
                vy: -Math.random() * 15 - 5,
                rot: Math.random() * 360,
                vrot: (Math.random() - 0.5) * 30,
                scale: 1
              });
            }
          });

          suctionEntities.forEach(ent => {
            ent.el.style.position = 'fixed';
            ent.el.style.left = '0px';
            ent.el.style.top = '0px';
            ent.el.style.margin = '0';
            ent.el.style.transition = 'none';
            document.body.appendChild(ent.el);
          });

          ['crane', 'profile-boxes'].forEach(id => {
            const wrapper = document.getElementById(id);
            if (wrapper) {
              wrapper.style.background = 'transparent';
              wrapper.style.boxShadow = 'none';
              wrapper.style.backdropFilter = 'none';
            }
          });
        }
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseActive) {
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        isMouseActive = true;
      }
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (!isMouseActive) {
        lastMouseX = e.touches[0].clientX;
        lastMouseY = e.touches[0].clientY;
        isMouseActive = true;
      }
      mouseX = e.touches[0].clientX;
      mouseY = e.touches[0].clientY;
    });

    // --- Scroll Physics Variables ---
    let bottomY = window.innerHeight + 150;
    let targetBottomY = window.innerHeight + 150;
    let curtainState = 'closed';

    window.addEventListener('wheel', (e) => {
      if (curtainState === 'opened') return;
      targetBottomY -= e.deltaY * 0.5;
      if (targetBottomY > window.innerHeight + 150) {
        targetBottomY = window.innerHeight + 150;
      }
    }, { passive: true });

    let lastTouchY = 0;
    window.addEventListener('touchstart', (e) => {
      lastTouchY = e.touches[0].clientY;
    });
    window.addEventListener('touchmove', (e) => {
      if (curtainState === 'opened') return;
      let dy = e.touches[0].clientY - lastTouchY;
      lastTouchY = e.touches[0].clientY;
      targetBottomY += dy * 1.5;
      if (targetBottomY > window.innerHeight + 150) {
        targetBottomY = window.innerHeight + 150;
      }
    });

    // --- Main Render Loop ---
    function render() {
      if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        if (targetBottomY > window.innerHeight + 50) {
          targetBottomY = window.innerHeight + 150;
          bottomY = window.innerHeight + 150;
        }
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (profileState === 'ended' || profileState === 'card_scene') {
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (profileState === 'card_scene') {
          let diffTarget = targetCardIndex - visualCardIndex;

          // 리니어 이동속도를 롤백하고 원래의 감속 부드러운 속도로 환원
          visualCardIndex += diffTarget * 0.08;

          if (cardSceneState === 'active_initial') {
            if (Math.abs(diffTarget) < 0.05) {
              visualCardIndex = targetCardIndex;
              cardSceneState = 'active';
            }
          }

          // Expand state Lerp logic
          if (cardSceneState === 'expanded') {
              // 카드 뽑기 시작 시 이동 속도를 느리게 조절 (서서히 가속)
              let expandSpeed = 0.025 + (expandProgress * 0.065);
              expandProgress += (1 - expandProgress) * expandSpeed;
          } else {
              expandProgress += (0 - expandProgress) * 0.08;
              if (expandProgress < 0.001) expandProgress = 0; // 부동소수점 무한대 오류 차단 (정확히 0으로 수렴)
          }
          
          let dimOver = document.getElementById('dim-overlay');
          if (dimOver) {
             dimOver.style.opacity = expandProgress * 0.9; // 뒷면 거의 까맣게
             dimOver.style.pointerEvents = expandProgress > 0.1 ? 'auto' : 'none'; // 확대 중 배경 클릭시 오작동 차단
          }

          generatedCards.forEach((cardEl, index) => {
            if (cardEl.dataset.spawned !== 'true') return;
            
            let diff = index - visualCardIndex;
            let absDiff = Math.abs(diff);
            
            // Widen gap
            let targetX = diff * 120;  
            // Arch
            let targetY = Math.pow(absDiff, 1.4) * 35; 
            
            // Pop up to the top
            let popUp = 0;
            if (cardSceneState === 'active' || cardSceneState === 'expanded' || expandProgress > 0.01) {
              popUp = Math.max(0, 1 - absDiff);
            } else if (cardSceneState === 'active_initial' && index === targetCardIndex) {
              // 이동 경로상의 다른 카드들은 무시하고 타겟 카드만 팝업됨
              popUp = Math.max(0, 1 - absDiff);
            }
            
            let finalY = targetY + (popUp * -150); 
            
            let rotZ = diff * 15;
            let rotY = 0;
            let tScale = 0.9; 

            // Expansion Physics Override
            let isTarget = (index === targetCardIndex);
            if (isTarget && expandProgress > 0) {
               // 당겨지며 왼쪽으로 스윽 빠지는 S-curve 모션 폭 대폭 상승
               let pullLeft = Math.sin(expandProgress * Math.PI) * -380;
               targetX += pullLeft;
               
               // 위치는 점진적으로 센터 0, 0 로 회귀
               targetX = targetX * (1 - expandProgress) + 0;
               finalY = finalY * (1 - expandProgress) + 0;
               
               // 가장 왼쪽(0.5) 지점을 지날 때부터 뒤집기와 확대가 시작되도록 제어
               let flipProgress = Math.max(0, (expandProgress - 0.5) * 2);
               
               // 회전 Z는 원래 각도에서 서서히 0으로 정렬 (전체 구간)
               rotZ = rotZ * (1 - expandProgress) + 0;
               
               // Y축 뒤집기와 크기 확대를 절반 이후(flipProgress) 구간에만 적용
               rotY = flipProgress * 180;
               tScale = tScale * (1 - flipProgress) + (2.2 * flipProgress);
            }

            // Spawning Animation via JS
            let p = parseFloat(cardEl.dataset.spawnProgress);
            if (p < 1) {
              p = Math.min(1, p + 0.02);
              cardEl.dataset.spawnProgress = p.toString();
            }
            
            let easeP = 1 - Math.pow(1 - p, 4); // Quartic ease out
            
            let startY = window.innerHeight * 1.5; 
            
            let currentX = targetX * easeP;
            let currentY = startY + ((finalY - startY) * easeP);
            let currentRotZ = rotZ * easeP;
            let currentScale = 0.6 + ((tScale - 0.6) * easeP);
            
            // Z-인덱스 고정, 회전 및 확대 시작 시점(0.5 초과)과 동일하게 카드 위로 올림
            let zIndex = index;
            if (isTarget && expandProgress > 0.5) {
               zIndex = 1000;
            }
            
            cardEl.style.transform = `translate(-50%, -50%) translateX(${currentX}px) translateY(${currentY}px) rotateZ(${currentRotZ}deg) rotateY(${rotY}deg) scale(${currentScale})`;
            cardEl.style.zIndex = zIndex;

            // 투명도 자체는 모두 원래대로 1로 고정하여 자체는 또렷하게 유지 (검정 오버레이가 가려줌)
            cardEl.style.opacity = 1;
            
            // 확대 모드 돌입 시 배경 카드들 물리적 클릭 비활성화
            if (!isTarget && expandProgress > 0) {
               cardEl.style.pointerEvents = expandProgress > 0.5 ? 'none' : 'auto';
            } else {
               cardEl.style.pointerEvents = 'auto';
            }
            
            // 그림자를 동일하게 유지하여 깊이감 제거, 단 확대 모드일 땐 추가
            if (isTarget && expandProgress > 0) {
               cardEl.style.boxShadow = `0 ${15 + expandProgress * 30}px ${35 + expandProgress * 45}px rgba(0,0,0,${0.8 - expandProgress*0.2})`;
            } else {
               cardEl.style.boxShadow = '0 15px 35px rgba(0,0,0,0.8)';
            }
          });
        }

        requestAnimationFrame(render);
        return;
      }



      // --- Mouse Spotlight Mechanics ---
      const dx = mouseX - lastMouseX;
      const dy = mouseY - lastMouseY;
      const distThisFrame = Math.sqrt(dx * dx + dy * dy);

      if (isMouseActive && curtainState !== 'opened') {
        if (distThisFrame > 0) {
          let idealRadius = 75 + distThisFrame * 0.9;
          targetRadius = Math.max(targetRadius, idealRadius);
          targetRadius = Math.min(targetRadius, 400);
        }
      }

      targetRadius = Math.max(0, targetRadius - 4);

      if (currentRadius < targetRadius) {
        currentRadius += (targetRadius - currentRadius) * 0.25;
      } else {
        currentRadius += (targetRadius - currentRadius) * 0.12;
      }

      lastMouseX = mouseX;
      lastMouseY = mouseY;


      // --- Curtain Scroll Physics Mechanics ---
      if (curtainState === 'closed') {
        if (targetBottomY < window.innerHeight * 0.45) {
          curtainState = 'opening';
          targetBottomY = -300;
        } else {
          targetBottomY += (window.innerHeight + 150 - targetBottomY) * 0.02;
        }
      } else if (curtainState === 'opening') {
        targetBottomY -= 15;
        if (bottomY < -200) {
          curtainState = 'opened';
          const el = document.querySelector('.scroll-text');
          if (el) el.classList.add('panic');
        }
      }

      bottomY += (targetBottomY - bottomY) * 0.08;

      // --- Render Curtain Layer ---
      if (curtainState !== 'opened') {
        let blurProgress = Math.max(0, 1 - (bottomY / window.innerHeight));
        let lineBlur = 60 + blurProgress * 80;
        ctx.filter = `blur(${lineBlur}px)`;
        ctx.fillStyle = '#050505';

        ctx.beginPath();
        ctx.moveTo(-200, -200);
        ctx.lineTo(canvas.width + 200, -200);
        ctx.lineTo(canvas.width + 200, bottomY);
        ctx.lineTo(-200, bottomY);
        ctx.lineTo(-200, -200);
        ctx.fill();

        if (currentRadius > 1) {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.filter = 'blur(25px)';
          ctx.beginPath();
          ctx.arc(mouseX, mouseY, currentRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
        }

        ctx.filter = 'none';
      }

      // --- Emoji Physics & Rendering ---
      ctx.globalCompositeOperation = 'destination-over';
      ctx.font = '60px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < emojis.length; i++) {
        let e1 = emojis[i];
        let fx = 0, fy = 0;

        if (curtainState === 'opened') {
          let ex = e1.x - mouseX;
          let ey = e1.y - mouseY;
          if (ex === 0 && ey === 0) { ex = 1; ey = 1; }
          let dist = Math.sqrt(ex * ex + ey * ey);
          fx += (ex / dist) * 1.5;
          fy += (ey / dist) * 1.5;
        } else {
          if (currentRadius > 1 && isMouseActive) {
            let ex = e1.x - mouseX;
            let ey = e1.y - mouseY;
            let dist = Math.sqrt(ex * ex + ey * ey) || 1;

            if (dist < currentRadius + 40) {
              let force = (currentRadius + 40 - dist) * 0.1;
              fx += (ex / dist) * force;
              fy += (ey / dist) * force;
            }
          }

          for (let j = 0; j < emojis.length; j++) {
            if (i === j) continue;
            let e2 = emojis[j];
            let ex = e1.x - e2.x;
            let ey = e1.y - e2.y;
            if (ex === 0 && ey === 0) {
              ex = Math.random() - 0.5;
              ey = Math.random() - 0.5;
            }
            let dist = Math.sqrt(ex * ex + ey * ey);

            if (dist < 70) {
              let force = (70 - dist) * 0.08;
              fx += (ex / dist) * force;
              fy += (ey / dist) * force;
            } else if (dist < 150) {
              let force = (150 - dist) * 0.003;
              fx += (ex / dist) * force;
              fy += (ey / dist) * force;
            }
          }

          const margin = 30;
          if (e1.x < margin) fx += (margin - e1.x) * 0.1;
          if (e1.x > canvas.width - margin) fx -= (e1.x - (canvas.width - margin)) * 0.1;
          if (e1.y < margin) fy += (margin - e1.y) * 0.1;
          if (e1.y > canvas.height - margin) fy -= (e1.y - (canvas.height - margin)) * 0.1;
        }

        e1.vx += fx;
        e1.vy += fy;

        if (curtainState !== 'opened') {
          e1.vx += (Math.random() - 0.5) * 0.6;
          e1.vy += (Math.random() - 0.5) * 0.6;
          e1.vx *= 0.82;
          e1.vy *= 0.82;
        } else {
          e1.vx *= 0.99;
          e1.vy *= 0.99;
        }

        e1.x += e1.vx;
        e1.y += e1.vy;

        ctx.fillText(e1.char, e1.x, e1.y);
      }

      // --- Profile Page Physics & Sequence ---
      if (curtainState === 'opened' && profileState === 'hidden') {
        profileState = 'crane_down';
        document.getElementById('profile-layer').style.opacity = '1';
      }

      if (profileState === 'crane_down') {
        craneHookY += 60; // 초고속 하강
        if (craneHookY > window.innerHeight + 200) {
          craneHookY = window.innerHeight + 200;
          craneYankVel = -60; // 낚아채는 상승 속도
          profileState = 'crane_yank';
        }
      } else if (profileState === 'crane_yank') {
        craneHookY += craneYankVel;
        boxesY = craneHookY;
        
        // 천장(길이 0) 충돌 시 크레인과 박스 모두 동일하게 감쇠 반사(Bounce)
        if (craneHookY <= 0) {
           craneHookY = 0;
           let bounceVel = Math.abs(craneYankVel) * 0.5;
           
           craneYVel = bounceVel; // 크레인 훅 반사는 그대로
           boxesYVel = 0; // 박스는 순간적으로 공중에 체공(Hang)하도록 하방 속도 0
           
           profileState = 'box_flying';
        }
      } else if (profileState === 'box_flying') {
        // 분리되어 공중에 체공하는 동안 서서히 35도 각도로 기울기 시작
        boxesAngle += (35 - boxesAngle) * 0.08;
        
        // 체공 시간 확보를 위해 낮은 중력(0.7) 적용
        boxesYVel += 0.7; 
        boxesY += boxesYVel;
        
        // 튕겨 내려오면서 원래 크레인 훅 정착점 부근(Y=75)에 도달하는 순간
        if (boxesY >= 75) {
           boxesY = 75;
           
           // 강제 스냅 제거: 지금까지 기울어진 각도는 유지하고,
           // 수직으로 떨어지던 속도를 폭발적인 회전(스윙) 속도로 변환하여 자연스럽게 연결
           boxesAngleVel = boxesYVel * 0.8; 
           boxesYVel = 0; 
           
           tackAnimProgress = 0;
           profileState = 'box_pinned';
        }
      } else if (profileState === 'box_pinned') {
        // 크레인 복귀는 아래 범용 물리가 자동 해결하도록 삭제

        // 압정 박히는 모션 (Scale 5 -> 1)
        if (tackAnimProgress < 1) {
           tackAnimProgress += 0.2;
        }
        
        // 감쇠 진동 (Pendulum Physics)
        boxesAngleVel -= boxesAngle * 0.15; // 중앙(0도)으로 당기는 스프링 힘
        boxesAngleVel *= 0.9; // 공기 저항/마찰력
        boxesAngle += boxesAngleVel;
        
        if (tackAnimProgress >= 1 && Math.abs(boxesAngle) < 0.1 && Math.abs(boxesAngleVel) < 0.1) {
          boxesAngle = 0;
          profileState = 'letters_settle';

          const spillContainer = document.getElementById('spilling-letters');
          targetSpans.forEach((span, idx) => {
            const spLetter = document.createElement('div');
            spLetter.className = 'spilled-char';
            spLetter.textContent = span.textContent;
            spillContainer.appendChild(spLetter);

            const compStyle = window.getComputedStyle(span);
            spLetter.style.fontSize = compStyle.fontSize;
            spLetter.style.color = compStyle.color;
            spLetter.style.textShadow = compStyle.textShadow;
            spLetter.style.fontWeight = compStyle.fontWeight;

            spilledLetters.push({
              element: spLetter,
              targetElement: span,
              x: -2000,
              y: -2000,
              vx: (Math.random() - 0.5) * 10,
              vy: (Math.random() - 0.5) * 5,
              rot: Math.random() * 360,
              timer: Math.random() * -60,
              spawned: false,
              settled: false
            });
          });
        }
      } else if (profileState === 'letters_settle') {
        if (spilledLetters.length > 0 && spilledLetters.every(l => l.settled)) {
          profileState = 'idle';
          document.getElementById('profile-layer').style.pointerEvents = 'auto';
        }
      }

      const wireEl = document.getElementById('crane-wire');
      if (wireEl) wireEl.style.height = `${Math.max(0, craneHookY)}px`;

      const boxesEl = document.getElementById('profile-boxes');
      if (boxesEl) {
         boxesEl.style.transformOrigin = '50% 20px'; // 압정이 꽂힌 정확한 위치를 축으로 회전
         boxesEl.style.transform = `translate(-50%, calc(-50% + ${boxesY}px)) rotateZ(${boxesAngle}deg)`;
      }

      const tackEl = document.getElementById('pinned-thumbtack');
      if (tackEl) {
         if (profileState === 'box_pinned' || profileState === 'letters_settle' || profileState === 'idle') {
            tackEl.style.opacity = '1';
            
            // 4배 크기, 우상단 화면 밖(X:600, Y:-800)에서 날아와 정확히 꽂히는 연출
            let tScale = Math.max(1, 4 - tackAnimProgress * 3);
            let moveX = (1 - tackAnimProgress) * 600;
            let moveY = (1 - tackAnimProgress) * -800;
            
            // 박스가 흔들릴 때(boxesAngle) 압정은 반대로 회전값을 빼주어 배경에 완벽히 고정된 것처럼 연출
            tackEl.style.transform = `translate(calc(-50% + ${moveX}px), ${moveY}px) rotate(${25 - boxesAngle}deg) scale(${tScale})`;
         } else {
            tackEl.style.opacity = '0';
         }
      }

      if (profileState === 'letters_settle') {
        spilledLetters.forEach(letter => {
          letter.timer++;

          if (letter.timer < 0) {
            letter.element.style.transform = `translate(-2000px, -2000px)`;
            return;
          }

          const rect = letter.targetElement.getBoundingClientRect();
          const targetX = rect.left;
          const targetY = rect.top;

          if (!letter.spawned) {
            letter.spawned = true;
            letter.x = targetX + (Math.random() - 0.5) * 50;
            letter.y = -50 - Math.random() * 50;
          }

          if (letter.settled) return;

          const dx = targetX - letter.x;
          const dy = targetY - letter.y;

          letter.vx += dx * 0.015;
          letter.vy += dy * 0.015;

          letter.vx *= 0.85;
          letter.vy *= 0.85;

          letter.x += letter.vx;
          letter.y += letter.vy;

          letter.rot *= 0.85;

          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 1 && Math.abs(letter.vx) < 0.2 && Math.abs(letter.vy) < 0.2) {
            letter.settled = true;
            letter.element.style.display = 'none';
            letter.targetElement.style.opacity = '1';
          }

          letter.element.style.transform = `translate(${letter.x}px, ${letter.y}px) rotate(${letter.rot}deg)`;
        });
      }

      // Interactive Crane Physics & Blackout Execution
      if (profileState === 'blackout') {
        const targetX = window.innerWidth / 2;
        const targetY = window.innerHeight;

        suctionEntities.forEach(ent => {
          if (ent.scale <= 0.05) return;

          const dx = targetX - (ent.x + ent.w / 2);
          const dy = targetY - (ent.y + ent.h / 2);
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;

          ent.vx += (dx / dist) * 1.5;
          ent.vy += (dy / dist) * 1.5;
          ent.vy += 0.5;

          ent.x += ent.vx;
          ent.y += ent.vy;
          ent.rot += ent.vrot;

          if (dist < 400) ent.scale *= 0.94;

          ent.el.style.transform = `translate(${ent.x}px, ${ent.y}px) rotate(${ent.rot}deg) scale(${ent.scale})`;
          if (ent.scale <= 0.05) ent.el.style.display = 'none';
        });

        const overlay = document.getElementById('darkness-overlay');
        if (overlay) {
          darknessRadius -= 1.5;
          overlay.style.setProperty('--dark-radius', `${Math.max(0, darknessRadius)}vw`);

          // === 블랙아웃 완료 ===
          if (darknessRadius < 0) {
            profileState = 'card_scene';
            document.body.style.background = 'black';

            // 기존 DOM UI 레이어 모두 숨김
            document.getElementById('darkness-overlay').style.display = 'none';
            document.getElementById('profile-layer').style.display = 'none';
            const scrollTxt = document.querySelector('.scroll-text');
            if (scrollTxt) scrollTxt.style.display = 'none';

            initCardScene();
          }
        }
      } else if (profileState === 'idle') {
        if (!isCraneGrabbed) {
          craneIdleTimer++;
          if (craneIdleTimer > 300) {
            craneIdleTimer = 0;
            const hookEl = document.querySelector('.crane-hook');
            if (hookEl) {
              const rect = hookEl.getBoundingClientRect();
              const x = rect.left + rect.width / 2;
              const y = rect.top + rect.height / 2;
              for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'crane-sparkle';
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                const angle = Math.random() * Math.PI * 2;
                const dist = 30 + Math.random() * 80;
                const size = 3 + Math.random() * 7;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                const colors = ['#f1c40f', '#fff', '#e67e22', '#f39c12'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                p.style.background = color;
                p.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
                p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
                p.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000 + Math.random() * 500);
              }
            }
          }
        } else {
          craneIdleTimer = 0;
        }
      }

      if (profileState !== 'hidden') {
        if (isCraneGrabbed) {
          const baseEl = document.querySelector('.crane-base');
          if (baseEl) {
            const baseRect = baseEl.getBoundingClientRect();
            const baseX = baseRect.left + baseRect.width / 2;
            const baseY = baseRect.top;
            const dx = mouseX - baseX;
            const dy = mouseY - baseY;
            craneAngle = Math.atan2(dx, Math.max(1, dy));
            craneVel = 0;

            const dist = Math.sqrt(dx * dx + dy * dy);
            craneHookY = Math.max(75, dist - 25);
            craneYVel = 0;
          }
        } else {
          if (profileState !== 'crane_down' && profileState !== 'crane_yank') {
            craneVel -= Math.sin(craneAngle) * 0.04;
            craneAngle += craneVel;
            craneVel *= 0.95;

            // 강제 리프팅/하강 구간을 제외하고는 항상 스프링처럼 75로 수렴
            if (profileState !== 'crane_down' && profileState !== 'crane_yank') {
              craneYVel -= (craneHookY - 75) * 0.1;
              craneHookY += craneYVel;
              craneYVel *= 0.85;
              
              // 크레인 줄 길이 0(천장) 도달 시 관성 방향 감쇠 반사(Bounce)
              if (craneHookY < 0) {
                 craneHookY = 0;
                 craneYVel = Math.abs(craneYVel) * 0.5; // 아래 방향으로 50% 텐션 반사
              }
            }
          }
        }
        const craneEl = document.getElementById('crane');
        if (craneEl) craneEl.style.transform = `translateX(-50%) rotate(${-craneAngle}rad)`;

        const portal = document.getElementById('bottom-portal');
        const dzIndicator = document.getElementById('drop-zone-indicator');

        if (profileState !== 'crane_down' && profileState !== 'blackout') {
          if (isCraneGrabbed) {
            const mDistY = window.innerHeight - mouseY;
            const mDistX = Math.abs(mouseX - window.innerWidth / 2);
            if (dzIndicator) {
              if (mDistY < 150 && mDistX < 192) {
                dzIndicator.style.opacity = '1';
              } else {
                dzIndicator.style.opacity = '0';
              }
            }

            const craneAbsoluteY = craneHookY * Math.cos(-craneAngle);
            const currentDistanceToBottom = window.innerHeight - (craneAbsoluteY + 80);

            if (currentDistanceToBottom < 300) {
              const scaleRange = Math.max(0, 1 - (currentDistanceToBottom / 300));

              portalRippleTimer++;
              if (portalRippleTimer > 100 - (scaleRange * 50)) {
                portalRippleTimer = 0;
                const rip = document.createElement('div');
                rip.className = 'portal-ripple';
                rip.style.width = `${scaleRange * 180}px`;
                rip.style.height = `${scaleRange * 180}px`;
                document.getElementById('profile-layer').insertBefore(rip, portal);
                setTimeout(() => rip.remove(), 8000);
              }
            }
          } else {
            if (dzIndicator) dzIndicator.style.opacity = '0';
          }
        } else {
          if (dzIndicator) dzIndicator.style.opacity = '0';
        }
      }

      ctx.globalCompositeOperation = 'source-over';
      requestAnimationFrame(render);
    }

    // --- Card Scene Variables & Interactions ---
    const cardDataList = [
      { id: 0 },
      { id: 1 },
      { id: 2 },
      { id: 3 },
      { id: 4 },
      { id: 5 },
      { id: 6 }
    ];
    let targetCardIndex = 0;
    let visualCardIndex = 0; // Physics iter variable
    let expandProgress = 0; // 확대 플립 애니메이션 변수 
    let generatedCards = [];
    let cardSceneState = 'hidden'; // 'hidden', 'spawning', 'active', 'active_initial', 'expanded'

    function initCardScene() {
      const scene = document.getElementById('card-scene');
      const wrapper = document.getElementById('cards-wrapper');

      scene.style.opacity = '1';
      scene.style.pointerEvents = 'auto'; // allow clicks

      wrapper.innerHTML = '';
      generatedCards = [];

      cardSceneState = 'spawning';
      targetCardIndex = Math.floor((cardDataList.length - 1) / 2); // 중앙 정렬 상태로 스폰
      visualCardIndex = targetCardIndex;

      cardDataList.forEach((data, index) => {
        let cardThemeClass = index === 6 ? 'card6-theme' : (index === 0 ? 'card0-theme' : '');
        let innerHTML = '';
        
        switch (index) {
          case 0:
            innerHTML = `
              <div class="card-title">Class Portfolio</div>
              <div class="card-content">
                <div class="icon-symbol">🎓</div>
                <p>A showcase of the comprehensive web development skills and projects acquired during the DC-AI-VIBE class.</p>
              </div>`;
            break;
          case 1:
            innerHTML = `
              <div class="card-title">AI Literacy</div>
              <div class="card-content">
                <div class="icon-symbol">✨</div>
                <p>How to properly utilize advanced AI models to your advantage.</p>
              </div>`;
            break;
          case 2:
            innerHTML = `
              <div class="card-title">Antigravity</div>
              <div class="card-content">
                <div class="icon-symbol">🚀</div>
                <p>Antigravity tutorial: The ultimate agentic workflow for building software.</p>
              </div>`;
            break;
          case 3:
            innerHTML = `
              <div class="card-title">Game Creation 1</div>
              <div class="card-content">
                <a href="pages/HalliGalli.html" target="_blank" class="card-link-block">
                  <div class="fake-img-placeholder" style="background: linear-gradient(135deg, #e74c3c, #c0392b);">Preview HalliGalli</div>
                </a>
                <p>Build a game with Antigravity.</p>
              </div>`;
            break;
          case 4:
            innerHTML = `
              <div class="card-title">Game Creation 2</div>
              <div class="card-content">
                <a href="pages/HalliGalli.html" target="_blank" class="card-link-block">
                  <div class="fake-img-placeholder" style="background: linear-gradient(135deg, #9b59b6, #8e44ad);">Preview My Game</div>
                </a>
                <p>Design and build your own game.</p>
              </div>`;
            break;
          case 5:
            innerHTML = `
              <div class="card-title">Website Building</div>
              <div class="card-content">
                <div class="highlight-text">You are looking at this page right now!</div>
                <p>Build your own website seamlessly with Github Pages.</p>
              </div>`;
            break;
          case 6:
            innerHTML = `
              <div class="card-title">Return to Start?</div>
              <div class="card-content">
                <p style="margin-bottom: 20px;">Would you like to restart the experience?</p>
                <div class="btn-group">
                  <button class="action-btn" onclick="location.reload()">Restart</button>
                </div>
              </div>`;
            break;
        }

        const cardWrap = document.createElement('div');
        cardWrap.className = 'card generated-card';
        cardWrap.innerHTML = `
          <div class="card-back ${cardThemeClass}"></div>
          <div class="card-front ${cardThemeClass}">
             <div class="close-card-btn">&times;</div>
             <div class="front-container">
               ${innerHTML}
             </div>
          </div>
        `;

        // 닫기 버튼 바인딩
        const closeBtn = cardWrap.querySelector('.close-card-btn');
        closeBtn.addEventListener('click', (e) => {
           e.stopPropagation();
           if (cardSceneState === 'expanded') {
               cardSceneState = 'active';
           }
        });

        // 카드 자체 클릭 바인딩
        cardWrap.addEventListener('click', (e) => {
           if (cardSceneState !== 'active') return;
           if (targetCardIndex !== index) {
               targetCardIndex = index; // 주변 카드인 경우 활성화
           } else {
               cardSceneState = 'expanded'; // 메인 카드인 경우 확대 애니메이션
           }
        });
        
        // Initial inline states for physics calc
        cardWrap.style.transform = `translate(-50%, -50%) scale(0.6)`;
        cardWrap.style.opacity = '0';
        cardWrap.dataset.spawned = 'false';
        cardWrap.dataset.spawnProgress = '0';

        wrapper.appendChild(cardWrap);
        generatedCards.push(cardWrap);

        // Fly out sequentially
        setTimeout(() => {
          cardWrap.dataset.spawned = 'true';
          cardWrap.style.opacity = '1';
        }, 500 + (index * 150));
      });

      // Show arrows and transition to active
      setTimeout(() => {
        cardSceneState = 'active_initial';
        targetCardIndex = 0; // 스폰 끝나면 첫번째 카드 포커싱하면서 화살표 등장
        document.getElementById('nav-left').classList.add('show');
        document.getElementById('nav-right').classList.add('show');
      }, 500 + (cardDataList.length * 150) + 300);
    }

    const cardScene = document.getElementById('card-scene');
    const navLeft = document.getElementById('nav-left');
    const navRight = document.getElementById('nav-right');

    navLeft.addEventListener('click', () => {
      if (cardSceneState !== 'active') return;
      if (targetCardIndex > 0) targetCardIndex--;
    });

    navRight.addEventListener('click', () => {
      if (cardSceneState !== 'active') return;
      if (targetCardIndex < cardDataList.length - 1) targetCardIndex++;
    });

    let scrollCooldown = false;
    cardScene.addEventListener('wheel', (e) => {
      if (profileState !== 'card_scene' || cardSceneState !== 'active') return;
      e.preventDefault();
      if (scrollCooldown) return;

      let direction = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? Math.sign(e.deltaX) : Math.sign(e.deltaY);

      if (direction > 0 && targetCardIndex < cardDataList.length - 1) {
        targetCardIndex++;
        scrollCooldown = true;
      } else if (direction < 0 && targetCardIndex > 0) {
        targetCardIndex--;
        scrollCooldown = true;
      }

      if (scrollCooldown) {
        setTimeout(() => scrollCooldown = false, 150); // 짧은 쿨다운으로 횟수 기준 제어
      }
    }, { passive: false });

    // Drag Physics variables
    let isDraggingCarousel = false;
    let dragStartX = 0;
    let dragStartIndex = 0;
    const PIXELS_PER_INDEX = 150; // Sensitivity 150px = 1 card shifted

    cardScene.addEventListener('mousedown', (e) => {
      if (profileState !== 'card_scene' || cardSceneState !== 'active') return;
      if (e.target.closest('.nav-arrow')) return;
      isDraggingCarousel = true;
      dragStartX = e.clientX;
      dragStartIndex = targetCardIndex;
      cardScene.style.cursor = 'grabbing';
    });

    cardScene.addEventListener('mousemove', (e) => {
      if (!isDraggingCarousel) return;
      let dx = dragStartX - e.clientX; // reversed drag map
      let dragOffset = dx / PIXELS_PER_INDEX;

      let rawTarget = dragStartIndex + dragOffset;
      // Hard clamp so drag doesn't pull far out of array visually
      targetCardIndex = Math.max(-0.5, Math.min(cardDataList.length - 0.5, rawTarget));
    });

    window.addEventListener('mouseup', (e) => {
      if (isDraggingCarousel) {
        isDraggingCarousel = false;
        cardScene.style.cursor = 'default';
        // Snap dragging visual position to nearest integer
        targetCardIndex = Math.max(0, Math.min(cardDataList.length - 1, Math.round(targetCardIndex)));
      }
    });

    cardScene.addEventListener('touchstart', (e) => {
      if (profileState !== 'card_scene' || cardSceneState !== 'active') return;
      if (e.target.closest('.nav-arrow')) return;
      isDraggingCarousel = true;
      dragStartX = e.touches[0].clientX;
      dragStartIndex = targetCardIndex;
    }, { passive: true });

    cardScene.addEventListener('touchmove', (e) => {
      if (!isDraggingCarousel) return;
      let dx = dragStartX - e.touches[0].clientX;
      let dragOffset = dx / PIXELS_PER_INDEX;
      let rawTarget = dragStartIndex + dragOffset;
      targetCardIndex = Math.max(-0.5, Math.min(cardDataList.length - 0.5, rawTarget));
    });

    cardScene.addEventListener('touchend', (e) => {
      if (isDraggingCarousel) {
        isDraggingCarousel = false;
        targetCardIndex = Math.max(0, Math.min(cardDataList.length - 1, Math.round(targetCardIndex)));
      }
    });

    // 렌더링 루프 시작
    requestAnimationFrame(render);
  </script>
</body>

</html>
